<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Vendas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">

        <div class="container-fluid">

            <a href="/" class="navbar-brand">
                CK Select Shop
            </a>

        </div>

    </nav>

    <div class="container mt-5">

        <!-- FORMULÁRIO -->

        <div class="card shadow p-4">

            <h3 class="mb-4">
                Registrar Venda
            </h3>

            <form
                action="/vendas/registrar"
                method="POST"
            >

                <div class="row">

                    <div class="col-md-5">

                        <select
                            name="produto_id"
                            class="form-control"
                            required
                        >

                            <option value="">
                                Produto
                            </option>

                            {% for produto in produtos %}

                            <option value="{{ produto.id }}">

                                {{ produto.nome }}

                                (Estoque: {{ produto.estoque }})

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-3">

                        <input
                            type="number"
                            name="quantidade"
                            class="form-control"
                            placeholder="Quantidade"
                            required
                        >

                    </div>

                    <div class="col-md-2">

                        <button
                            type="submit"
                            class="btn btn-success w-100"
                        >
                            Vender
                        </button>

                    </div>

                </div>

            </form>

        </div>

        <!-- HISTÓRICO -->

        <div class="card shadow mt-4 p-4">

            <h3 class="mb-4">
                Histórico de Vendas
            </h3>

            <table class="table table-hover">

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Produto</th>
                        <th>Quantidade</th>
                        <th>Valor Total</th>
                        <th>Data</th>

                    </tr>

                </thead>

                <tbody>

                    {% for venda in vendas %}

                    <tr>

                        <td>{{ venda.id }}</td>

                        <td>{{ venda.produto.nome }}</td>

                        <td>{{ venda.quantidade }}</td>

                        <td>

                            R$ {{ venda.valor_total }}

                        </td>

                        <td>

                            {{ venda.data.strftime('%d/%m/%Y %H:%M') }}

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
