<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <title>Financeiro</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">

        <div class="container-fluid">

            <a href="/" class="navbar-brand">
                CK Select Shop
            </a>

        </div>

    </nav>

    <div class="container mt-5">

        <div class="row mb-4">

            <div class="col-md-4">

                <div class="card shadow p-3 text-center">

                    <h5>Entradas</h5>

                    <h2 class="text-success">
                        R$ {{ entradas }}
                    </h2>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card shadow p-3 text-center">

                    <h5>Saídas</h5>

                    <h2 class="text-danger">
                        R$ {{ saidas }}
                    </h2>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card shadow p-3 text-center">

                    <h5>Saldo</h5>

                    <h2>
                        R$ {{ saldo }}
                    </h2>

                </div>

            </div>

        </div>

        <div class="card shadow p-4">

            <h3 class="mb-4">
                Nova movimentação
            </h3>

            <form action="/financeiro/adicionar" method="POST">

                <div class="row">

                    <div class="col-md-3">

                        <select
                            name="tipo"
                            class="form-control"
                            required
                        >

                            <option value="">
                                Tipo
                            </option>

                            <option value="entrada">
                                Entrada
                            </option>

                            <option value="saida">
                                Saída
                            </option>

                        </select>

                    </div>

                    <div class="col-md-5">

                        <input
                            type="text"
                            name="descricao"
                            class="form-control"
                            placeholder="Descrição"
                            required
                        >

                    </div>

                    <div class="col-md-2">

                        <input
                            type="number"
                            step="0.01"
                            name="valor"
                            class="form-control"
                            placeholder="Valor"
                            required
                        >

                    </div>

                    <div class="col-md-2">

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Salvar
                        </button>

                    </div>

                </div>

            </form>

        </div>

        <div class="card shadow mt-4 p-4">

            <h3 class="mb-4">
                Histórico Financeiro
            </h3>

            <table class="table table-hover">

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Tipo</th>
                        <th>Descrição</th>
                        <th>Valor</th>

                    </tr>

                </thead>

                <tbody>

                    {% for registro in registros %}

                    <tr>

                        <td>{{ registro.id }}</td>

                        <td>{{ registro.tipo }}</td>

                        <td>{{ registro.descricao }}</td>

                        <td>
                            R$ {{ registro.valor }}
                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</body>
</html>
