<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>CK Select Shop</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-4">

                <div class="card shadow p-4">

                    <h2 class="text-center mb-4">
                        CK Select Shop
                    </h2>

                    <form
                        action="/login"
                        method="POST"
                    >

                        <input
                            type="text"
                            name="usuario"
                            class="form-control mb-3"
                            placeholder="Usuário"
                            required
                        >

                        <input
                            type="password"
                            name="senha"
                            class="form-control mb-3"
                            placeholder="Senha"
                            required
                        >

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Entrar
                        </button>

                        <a
                            href="/cadastro"
                            class="btn btn-link mt-3"
                        >
                            Criar Conta
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
